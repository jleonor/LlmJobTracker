    <path d="M 200 499 L 436 541" fill="none" stroke="#e0e2e9" stroke-width="37" stroke-linecap="butt"/>
    <rect x="418" y="494" width="139" height="89" rx="24" fill="#e0e2e9"/>
    <path d="M 683 486
