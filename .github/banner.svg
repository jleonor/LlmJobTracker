<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">LlmJobTracker</title>
  <desc id="bannerDesc">A local, single-user job-search tracker. LLM-assisted positioning, tailored CVs and cover letters, reviewed and approved by you.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141922"/>
      <stop offset="1" stop-color="#0b0e12"/>
    </linearGradient>
    <radialGradient id="glow" cx="148" cy="150" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2a93b" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f2a93b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- Icon badge -->
  <rect x="60" y="62" width="176" height="176" rx="40" fill="#181c21" stroke="#31353b" stroke-width="2"/>

