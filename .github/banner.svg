  <rect x="272" y="158" width="70" height="4" rx="2" fill="#f2a93b"/>

  <text x="270" y="190" font-family="Verdana, 'Segoe UI', sans-serif" font-size="25" fill="#e0e2e9">A local, single-user job-search tracker</text>
  <text x="270" y="222" font-family="Verdana, 'Segoe UI', sans-serif" font-size="18" fill="#9e8e7c">LLM-assisted positioning, tailored CVs and cover letters.</text>
  <text x="270" y="248" font-family="Verdana, 'Segoe UI', sans-serif" font-size="18" fill="#9e8e7c">You review and approve every result.</text>
