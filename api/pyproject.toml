[project]
name = "llmjobtracker"
version = "0.1.0"
description = "LlmJobTracker API"
requires-python = ">=3.12"
dependencies = [
    "bleach>=6.4.0",
    "dxpdf>=0.8.1",
    "extract-msg>=0.56.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "langgraph>=1.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "trafilatura>=2.0",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "respx>=0.23.1",
    "ruff>=0.8",
    "types-bleach>=6.4.0.20260728",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# No stub package exists for dxpdf (D-107: chosen for docx preview, verified by a real
# conversion against tests/fixtures/synthetic/profile/cv_en.docx).
module = "dxpdf"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests call the real Claude CLI and cost money. Run them with: uv run pytest -m live
addopts = "-m 'not live'"
markers = ["live: calls the real Claude Code CLI"]
