[project]
name = "localjobtracker"
version = "0.1.0"
description = "Local job application tracker API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests call the real Claude CLI and cost money. Run them with: uv run pytest -m live
addopts = "-m 'not live'"
markers = ["live: calls the real Claude Code CLI"]
